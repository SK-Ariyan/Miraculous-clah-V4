<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Selection | Miraculous Clash</title>

    <link rel="stylesheet" href="../css/transition.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at center, #302052, #10091f 75%);
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: auto;
            padding: 20px 0;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 38px;
            color: #e3b7ff;
            text-shadow: 0 0 15px #a855f7;
            margin-bottom: 10px;
        }

        #selectionStatus {
            font-size: 20px;
            color: #ffd76a;
        }

        .selectedHeroes {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(200,150,255,0.3);
            border-radius: 15px;
        }

        .selectedBox {
            width: 40%;
            text-align: center;
        }

        .selectedBox h2 {
            color: #d8b4fe;
        }

        .selectedBox img {
            width: 100px;
            height: 110px;
            object-fit: contain;
        }

        .selectedBox p {
            color: #ccc;
        }

        .versus {
            font-size: 32px;
            font-weight: bold;
            color: #ffcc55;
        }

        .heroGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .heroCard {
            background: linear-gradient(145deg, #35234e, #191126);
            border: 2px solid #594078;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .heroCard:hover {
            transform: translateY(-5px);
            border-color: #d8a5ff;
            box-shadow: 0 0 15px #9b5de5;
        }

        .heroCard img {
            width: 100%;
            height: 125px;
            object-fit: contain;
        }

        .heroCard h3 {
            margin: 8px 0 4px;
            color: #f0d5ff;
        }

        .role {
            color: #ffc857;
            font-size: 13px;
        }

        .stats {
            text-align: left;
            font-size: 13px;
            line-height: 1.8;
            color: #ddd;
            margin-top: 8px;
        }

        .heroCard.selected {
            opacity: 0.35;
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .heroCard.selected::after {
            content: "SELECTED";
            display: block;
            color: #7cff9b;
            font-weight: bold;
            margin-top: 8px;
        }

        .bottomControls {
            text-align: center;
            margin: 30px 0;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
        }

        #startBattle {
            background: linear-gradient(90deg, #a855f7, #6d28d9);
            color: white;
            display: none;
        }

        #startBattle:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #backButton {
            background: #40334e;
            color: white;
        }

        @media(max-width: 850px) {
            .heroGrid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media(max-width: 550px) {
            .heroGrid {
                grid-template-columns: repeat(2, 1fr);
            }

            header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div id="fadeScreen"></div>
<button id="backButton">⬅ Back</button>

<div class="container">

    <header>
        <h1>⚔️ CHOOSE YOUR HERO ⚔️</h1>
        <p id="selectionStatus">PLAYER 1 — SELECT YOUR HERO</p>
    </header>

    <div class="selectedHeroes">

        <div class="selectedBox">
            <h2 id="player1Title">PLAYER 1</h2>
            <img id="player1Preview"
                 src=""
                 style="display:none">

            <p id="player1Selected">Not selected</p>
        </div>

        <div class="versus">VS</div>

        <div class="selectedBox">
            <h2 id="player2Title">PLAYER 2</h2>
            <img id="player2Preview"
                 src=""
                 style="display:none">

            <p id="player2Selected">Not selected</p>
        </div>

    </div>

    <div class="heroGrid" id="heroGrid"></div>

    <div class="bottomControls">

        

        <button id="startBattle">
            START BATTLE ⚔️
        </button>

    </div>

</div>

<script>
    document.getElementById("backButton").onclick = () => {
    goTo("lobby.html");
};

</script>



<script src="../js/core/transition.js"></script>
<script src="../js/core/navigation.js"></script>
<script src="../js/data/battleHeroes.js"></script>

<audio id="musicPlayer" loop>
    <source src="../sounds/BGMS.wav" type="audio/wav">
</audio>

<script>

const mode = sessionStorage.getItem("mode");

const isAI = mode === "ai";

const heroSelectionPlayerName =
    localStorage.getItem("playerName") || "Player";

let player1Index = null;
let player2Index = null;

let selectingPlayer = 1;

const heroGrid = document.getElementById("heroGrid");

const statusText =
    document.getElementById("selectionStatus");

const startButton =
    document.getElementById("startBattle");


// PLAYER NAMES

document.getElementById("player1Title").textContent =
    heroSelectionPlayerName;
document.getElementById("player2Title").textContent =
    isAI ? "AI OPPONENT" : "PLAYER 2";


// CREATE HERO CARDS

battleHeroes.forEach((hero, index) => {

    const card = document.createElement("div");

    card.className = "heroCard";

    card.innerHTML = `

        <img src="${hero.cards.normal}">

        <h3>${hero.name}</h3>

        <div class="role">${hero.role}</div>

        <div class="stats">

            ❤️ HP: ${hero.attributes.hp}<br>

            ⚔️ Attack: ${hero.attributes.attack}<br>

            🛡️ Shield: ${hero.attributes.shield}

        </div>

    `;

    card.addEventListener("click", () => {

        selectHero(index);

    });

    heroGrid.appendChild(card);

});


// SELECT HERO

function selectHero(index) {

    if(selectingPlayer === 1) {

        if(player1Index !== null)
            return;

        player1Index = index;

        updatePreview(1, battleHeroes[index]);

        markSelected(index);

        if(isAI) {

            selectRandomAIHero();

        } else {

            selectingPlayer = 2;

            statusText.textContent =
                "PLAYER 2 — SELECT YOUR HERO";

        }

    } else {

        if(index === player1Index)
            return;

        if(player2Index !== null)
            return;

        player2Index = index;

        updatePreview(2, battleHeroes[index]);

        markSelected(index);

        finishSelection();

    }

}


// RANDOM AI HERO

function selectRandomAIHero() {

    const availableHeroes = battleHeroes
        .map((hero, index) => index)
        .filter(index => index !== player1Index);

    const randomIndex = Math.floor(
        Math.random() * availableHeroes.length
    );

    player2Index = availableHeroes[randomIndex];

    updatePreview(2, battleHeroes[player2Index]);

    markSelected(player2Index);

    finishSelection();

}


// UPDATE PREVIEW

function updatePreview(player, hero) {

    const image = document.getElementById(
        `player${player}Preview`
    );

    const name = document.getElementById(
        `player${player}Selected`
    );

    image.src = hero.cards.normal;

    image.style.display = "inline-block";

    name.textContent =
        `${hero.name} (${hero.role})`;

}


// DISABLE SELECTED HERO

function markSelected(index) {

    const cards =
        document.querySelectorAll(".heroCard");

    cards[index].classList.add("selected");

}


// FINISH SELECTION

function finishSelection() {

    statusText.textContent =
        "✨ HERO SELECTION COMPLETE! ✨";

    startButton.style.display = "inline-block";

}


// START BATTLE

startButton.addEventListener("click", () => {

    if(player1Index === null || player2Index === null)
        return;

    sessionStorage.setItem(
        "player1HeroIndex",
        player1Index
    );

    sessionStorage.setItem(
        "player2HeroIndex",
        player2Index
    );

    goTo("battle.html");

});


// BACK BUTTON

document.getElementById("backButton").onclick = () => {

    history.back();

};
</script>



<script src="../js/core/music.js"></script>

<script src="../js/core/info.js"></script>



</body>
</html>
