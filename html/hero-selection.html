<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c081e">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">

    <title>Hero Selection | Miraculous Clash</title>

    <link rel="stylesheet" href="../css/transition.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at center, #302052, #10091f 75%);
        }

        body {
    background-image: url("../assets/background/HeroPage.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
}

        .container {
            width: 95%;
            max-width: 1400px;
            margin: auto;
            padding: 20px 0;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 38px;
            color: #e3b7ff;
            text-shadow: 0 0 15px #a855f7;
            margin-bottom: 10px;
        }

        #selectionStatus {
            font-size: 20px;
            color: #ffd76a;
        }

        .selectedHeroes {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 20px;
    margin: 20px 0;
    padding: 20px;
    min-height: 260px;
    background: rgba(20, 10, 40, 0.75);
    border: 1px solid rgba(200,150,255,0.4);
    border-radius: 18px;
}

        .selectedBox {
            width: 40%;
            text-align: center;
        }

        .selectedBox h2 {
            color: #d8b4fe;
        }

        .selectedBox img {
    width: 190px;
    height: 175px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(190, 130, 255, 0.5));
}

        .selectedBox p {
            color: #ccc;
        }

        .versus {
            font-size: 32px;
            font-weight: bold;
            color: #ffcc55;
        }

        .heroGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        /* HERO CARD DESIGN */
/* HERO CARD DESIGN */
.heroCard {
    width: 100%;
    min-height: 230px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 25%, rgba(45, 110, 180, 0.25), transparent 65%),
        linear-gradient(145deg, #172c48, #091321);

    border: 1px solid #557da8;
    border-radius: 15px;

    box-shadow: inset 0 0 15px rgba(80, 150, 220, 0.12);
    transition: 0.3s ease;
}

/* CHARACTER IMAGE */
.heroCard img {
    width: 100%;
    height: 165px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(120, 180, 255, 0.4));
    transition: transform 0.3s ease;
}

/* HERO NAME */
.heroCard h3 {
    margin: 8px 0;
    font-size: 19px;
    letter-spacing: 1px;
    color: #f5e5b5;
    text-shadow: 0 0 8px rgba(255, 205, 100, 0.4);
}

/* ROLE BADGE */
.role {
    display: inline-block;
    padding: 5px 14px;
    margin-top: 3px;

    color: #ffd76a;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;

    background: rgba(255, 215, 106, 0.10);
    border: 1px solid rgba(255, 215, 106, 0.45);
    border-radius: 20px;
}

/* HOVER EFFECT */
.heroCard:hover {
    transform: translateY(-6px);
    border-color: #e6c477;

    box-shadow:
        0 0 18px rgba(100, 170, 230, 0.45),
        inset 0 0 18px rgba(100, 170, 230, 0.15);
}

.heroCard:hover img {
    transform: scale(1.08);
}
        .stats {
            text-align: left;
            font-size: 13px;
            line-height: 1.8;
            color: #ddd;
            margin-top: 8px;
        }

        .heroCard.selected {
            opacity: 0.35;
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .heroCard.selected::after {
            content: "SELECTED";
            display: block;
            color: #7cff9b;
            font-weight: bold;
            margin-top: 8px;
        }

        .bottomControls {
            text-align: center;
            margin: 30px 0;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
        }

        #startBattle {
            background: linear-gradient(90deg, #a855f7, #6d28d9);
            color: white;
            display: none;
        }

        #startBattle:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #backButton {
            background: #40334e;
            color: white;
        }

        @media(max-width: 850px) {
            .heroGrid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media(max-width: 550px) {
            .heroGrid {
                grid-template-columns: repeat(2, 1fr);
            }

            header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div id="fadeScreen"></div>
<button id="backButton">⬅ Back</button>

<div class="container">

    <header>
        <h1>⚔️ CHOOSE YOUR HERO ⚔️</h1>
        <p id="selectionStatus">PLAYER 1 — SELECT YOUR HERO</p>
    </header>

    <div class="selectedHeroes">

        <div class="selectedBox">
            <h2 id="player1Title">PLAYER 1</h2>
            <img id="player1Preview"
                 src=""
                 style="display:none">

            <p id="player1Selected">Not selected</p>
        </div>

        <div class="versus">VS</div>

        <div class="selectedBox">
            <h2 id="player2Title">PLAYER 2</h2>
            <img id="player2Preview"
                 src=""
                 style="display:none">

            <p id="player2Selected">Not selected</p>
        </div>

    </div>

    <div class="heroGrid" id="heroGrid"></div>

    <div class="bottomControls">

        

        <button id="startBattle">
            START BATTLE ⚔️
        </button>

    </div>

</div>

<script>
    document.getElementById("backButton").onclick = () => {
    goTo("lobby.html");
};

</script>



<script src="../js/core/transition.js"></script>
<script src="../js/core/mobile.js"></script>
<script src="../js/core/navigation.js"></script>
<script src="../js/data/battleHeroes.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="../js/multiplayer/session.js"></script>

<audio id="musicPlayer" loop>
    <source src="../sounds/BGMS.wav" type="audio/wav">
</audio>

<script>

const mode = sessionStorage.getItem("mode");

const isAI = mode === "ai";

const heroSelectionPlayerName =
    localStorage.getItem("playerName") || "Player";

let player1Index = null;
let player2Index = null;

let selectingPlayer = 1;

const heroGrid = document.getElementById("heroGrid");

const statusText =
    document.getElementById("selectionStatus");

const startButton =
    document.getElementById("startBattle");

    // ==========================================
// MULTIPLAYER HERO SELECTION
// ==========================================

const isMultiplayer = mode === "multiplayer";

let multiplayerSocket = null;
let multiplayerHeroState = null;

let multiplayerSeat =
    sessionStorage.getItem("multiplayerSeat");

function updateMultiplayerNames(players) {

    if (!players) return;

    const p1 = players.find(p => p.seat === "p1");
    const p2 = players.find(p => p.seat === "p2");

    if (p1) {
        document.getElementById("player1Title").textContent =
            p1.username;
    }

    if (p2) {
        document.getElementById("player2Title").textContent =
            p2.username;
    }
}

function renderMultiplayerHeroes(state) {

    if (!state || state.roomId !== sessionStorage.getItem("multiplayerRoomId"))
        return;

    multiplayerHeroState = state;

    player1Index = state.selections.p1;
    player2Index = state.selections.p2;

    // Reset cards
    document.querySelectorAll(".heroCard").forEach(card => {
        card.classList.remove("selected");
    });

    // Display Player 1 selection
    if (player1Index !== null) {
        updatePreview(1, battleHeroes[player1Index]);
        markSelected(player1Index);
    } else {
        document.getElementById("player1Preview").style.display = "none";
        document.getElementById("player1Selected").textContent = "Not selected";
    }

    // Display Player 2 selection
    if (player2Index !== null) {
        updatePreview(2, battleHeroes[player2Index]);
        markSelected(player2Index);
    } else {
        document.getElementById("player2Preview").style.display = "none";
        document.getElementById("player2Selected").textContent = "Not selected";
    }

    // Selection status
    if (state.status === "complete") {

        // Save both hero selections on both players' browsers
sessionStorage.setItem("player1HeroIndex", state.selections.p1);
sessionStorage.setItem("player2HeroIndex", state.selections.p2);

    if (multiplayerSeat === "p1") {

        statusText.textContent = "✨ HERO SELECTION COMPLETE! CLICK TO START ✨";
        startButton.style.display = "inline-block";

    } else {

        statusText.textContent = "✨ HERO SELECTION COMPLETE! WAITING FOR PLAYER 1... ✨";
        startButton.style.display = "none";

    }

} else {

        startButton.style.display = "none";

        if (state.currentSeat === "p2") {

            statusText.textContent =
                multiplayerSeat === "p2"
                ? "YOUR TURN — SELECT YOUR HERO"
                : "WAITING FOR PLAYER 2 TO SELECT...";

        } else if (state.currentSeat === "p1") {

            statusText.textContent =
                multiplayerSeat === "p1"
                ? "YOUR TURN — SELECT YOUR HERO"
                : "WAITING FOR PLAYER 1 TO SELECT...";

        }
    }
}

function connectMultiplayerHeroes() {

    
    multiplayerSocket = io();
    multiplayerSocket.on("battle-started", state => {
    if (state?.roomId === sessionStorage.getItem("multiplayerRoomId"))
        goTo("battle.html");
});

    multiplayerSocket.on("connect", () => {

        const roomId =
            sessionStorage.getItem("multiplayerRoomId");

        const playerToken =
            sessionStorage.getItem("multiplayerPlayerToken");

        if (!roomId || !playerToken) {
            multiplayerSession.clear({ clearTeams: true });
            goTo("multiplayer.html");
            return;
        }

        multiplayerSocket.emit("rejoin-room", {
            roomId,
            playerToken
        }, response => {

            if (!response?.success) {
                multiplayerSession.clear({ clearTeams: true });
                goTo("multiplayer.html");
                return;
            }

            multiplayerSeat = response.seat;

            updateMultiplayerNames(response.players);

            if (response.battle?.status === "finished") {
                multiplayerSession.leave(multiplayerSocket, () => goTo("multiplayer.html"));
                return;
            }

            if (response.battle) {
                goTo("battle.html");
                return;
            }

            if (!response.heroState) {
                goTo("kwami.html");
                return;
            }

            renderMultiplayerHeroes(response.heroState);

        });

    });

    // Receive selections from both players
    multiplayerSocket.on("hero-state", state => {

        renderMultiplayerHeroes(state);

    });

    const handleRoomClosed = data => {
        if (data?.roomId !== sessionStorage.getItem("multiplayerRoomId"))
            return;
        multiplayerSession.clear({ clearTeams: true });
        goTo("multiplayer.html");
    };

    multiplayerSocket.on("room-closed", handleRoomClosed);
    multiplayerSocket.on("match-closed", handleRoomClosed);

}

// PLAYER NAMES

document.getElementById("player1Title").textContent =
    heroSelectionPlayerName;
document.getElementById("player2Title").textContent =
    isAI ? "AI OPPONENT" : "PLAYER 2";


// CREATE HERO CARDS

battleHeroes.forEach((hero, index) => {

    const card = document.createElement("div");

    card.className = "heroCard";

    card.innerHTML = `

        <img src="${hero.cards.normal}">

        <h3>${hero.name}</h3>

        <div class="role">${hero.role}</div>

        

    `;

    card.addEventListener("click", () => {

        selectHero(index);

    });

    heroGrid.appendChild(card);

});


// SELECT HERO

function selectHero(index) {

        if (isMultiplayer) {

        selectMultiplayerHero(index);

        return;

    }

    if(selectingPlayer === 1) {

        if(player1Index !== null)
            return;

        player1Index = index;

        updatePreview(1, battleHeroes[index]);

        markSelected(index);

        if(isAI) {

            selectRandomAIHero();

        } else {

            selectingPlayer = 2;

            statusText.textContent =
                "PLAYER 2 — SELECT YOUR HERO";

        }

    } else {

        if(index === player1Index)
            return;

        if(player2Index !== null)
            return;

        player2Index = index;

        updatePreview(2, battleHeroes[index]);

        markSelected(index);

        finishSelection();

    }

}

function selectMultiplayerHero(index) {

    if (!multiplayerHeroState) return;

    if (multiplayerHeroState.status !== "selecting")
        return;

    if (multiplayerHeroState.currentSeat !== multiplayerSeat)
        return;

    if (
        Object.values(multiplayerHeroState.selections)
        .includes(index)
    ) {
        alert("This hero has already been selected!");
        return;
    }

    multiplayerSocket.emit("hero-action", {

        roomId: sessionStorage.getItem("multiplayerRoomId"),

        heroId: index

    }, response => {

        if (!response?.success) {

            alert(response?.message || "Hero selection failed.");

            return;

        }

        renderMultiplayerHeroes(response.state);

    });

}
// RANDOM AI HERO

function selectRandomAIHero() {

    const availableHeroes = battleHeroes
        .map((hero, index) => index)
        .filter(index => index !== player1Index);

    const randomIndex = Math.floor(
        Math.random() * availableHeroes.length
    );

    player2Index = availableHeroes[randomIndex];

    updatePreview(2, battleHeroes[player2Index]);

    markSelected(player2Index);

    finishSelection();

}


// UPDATE PREVIEW

function updatePreview(player, hero) {

    const image = document.getElementById(
        `player${player}Preview`
    );

    const name = document.getElementById(
        `player${player}Selected`
    );

    image.src = hero.cards.normal;

    image.style.display = "inline-block";

    name.textContent =
        `${hero.name} (${hero.role})`;

}


// DISABLE SELECTED HERO

function markSelected(index) {

    const cards =
        document.querySelectorAll(".heroCard");

    cards[index].classList.add("selected");

}


// FINISH SELECTION

function finishSelection() {

    statusText.textContent =
        "✨ HERO SELECTION COMPLETE! ✨";

    startButton.style.display = "inline-block";

}


// START BATTLE

startButton.addEventListener("click", () => {

    if(player1Index === null || player2Index === null)
        return;

    sessionStorage.setItem("player1HeroIndex", player1Index);
sessionStorage.setItem("player2HeroIndex", player2Index);

if (isMultiplayer) {
    startButton.disabled = true;
    startButton.textContent = "STARTING...";

    multiplayerSocket.emit("start-battle", {
        roomId: sessionStorage.getItem("multiplayerRoomId"),
        playerToken: sessionStorage.getItem("multiplayerPlayerToken")
    }, (response) => {
        if (!response || !response.success) {
            startButton.disabled = false;
            startButton.textContent = "START BATTLE";
            alert(response?.message || "Could not start the battle.");
        }
    });
} else {
    goTo("battle.html");
}

});


// BACK BUTTON

document.getElementById("backButton").onclick = () => {

    if (!isMultiplayer) {
        history.back();
        return;
    }

    multiplayerSession.leave(multiplayerSocket, response => {
        if (!response?.success) {
            alert(response?.message || "Unable to leave the multiplayer room.");
            return;
        }

        goTo("multiplayer.html");
    });

};

if (isMultiplayer) {

    // Multiplayer uses server-controlled selections.
    connectMultiplayerHeroes();

}
</script>



<script src="../js/core/music.js"></script>

<script src="../js/core/info.js"></script>



</body>
</html>
